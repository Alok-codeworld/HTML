<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      padding-top: 70px;
      font-family: Arial, sans-serif;
    }
    /* Navbar */
    #navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: black;
      z-index: 1000;
      padding: 10px 30px;
      animation: slideDown 0.8s ease;
    }
    #navbar a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      position: relative;
    }
    #navbar a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00bfff;
      transition: 0.3s;
    }
    #navbar a:hover::after {
      width: 100%;
    }
    @keyframes slideDown { from { top: -70px; } to { top: 0; } }
    /* Product Section */
    .product-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin-top: 30px;
    }
    .product-image {
      flex: 1 1 350px;
      max-width: 500px;
      animation: fadeInLeft 0.8s ease;
    }
    .product-image img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
    .product-details {
      flex: 1 1 350px;
      max-width: 500px;
      animation: fadeInRight 0.8s ease;
    }
    .product-details h2 { font-weight: bold; }
    .price { color: #28a745; font-size: 24px; margin: 10px 0; }
    .rating { color: #ffc107; margin-bottom: 15px; }
    .description { font-size: 16px; line-height: 1.5; color: #555; }
    .btn-buy {
      border-radius: 20px;
      padding: 10px 25px;
      font-weight: bold;
      transition: transform 0.3s;
    }
    .btn-buy:hover { transform: scale(1.05); }
    @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes fadeInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
    @media(max-width:768px){ .product-container { flex-direction: column; align-items: center; } }
  </style>
</head>
<body>

<!-- Navbar -->
<nav id="navbar" class="d-flex justify-content-between align-items-center">
  <div>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
  </div>
</nav>

<!-- Product Section -->
<div class="container product-container">
  <!-- Left: Product Image -->
  <div class="product-image">
    <img id="product-img" src="" alt="Product Image">
  </div>

  <!-- Right: Product Details -->
  <div class="product-details">
    <h2 id="product-name"></h2>
    <div class="price" id="product-price"></div>
    <div class="rating" id="product-rating"></div>
    <div class="description" id="product-description"></div>
    <div class="mt-4">
      <button class="btn btn-primary btn-buy" onclick="addToCart()">Add to Cart</button>
      <button class="btn btn-outline-dark" onclick="window.location.href='Checkout.html'"> BUY PRODUCT</button>
    </div>
  </div>
</div>

  // Read product ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('product') || "honitus";

  // Find the product
  const product = products.find(p => p.id === productId);

  // Set product details on page
  if(product){
    document.getElementById("product-name").innerText = product.name;
    document.getElementById("product-price").innerText = product.price;
    document.getElementById("product-rating").innerText = product.rating;
    document.getElementById("product-description").innerText = product.description;
    document.getElementById("product-img").src = product.img;
  }

  // Add to Cart function
  let cartCount = 0;
  function addToCart() {
    cartCount++;
    document.getElementById("cart-count").innerText = cartCount;
    alert(product.name + " added to cart! Total items: " + cartCount);

</script>

</body>
</html>
