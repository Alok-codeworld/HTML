<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Registration - PharmaPoint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #00bfff, #f5f7fa);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 400px;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      background-color: white;
      position: relative;
      animation: fadeIn 1s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #007bff;
    }

    .form-control { margin-bottom: 15px; border-radius: 10px; }
    .btn-primary { width: 100%; border-radius: 20px; transition: transform 0.3s; }
    .btn-primary:hover { transform: scale(1.05); }

    .switch-form {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
    .switch-form a { cursor: pointer; color: #007bff; text-decoration: none; }
    .switch-form a:hover { text-decoration: underline; }

    @keyframes fadeIn { from {opacity:0; transform: translateY(20px);} to {opacity:1; transform: translateY(0);} }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- Login Form -->
  <div id="login-form">
    <h2>Login</h2>
    <input type="email" class="form-control" id="login-email" placeholder="Email" required>
    <input type="password" class="form-control" id="login-password" placeholder="Password" required>
    <button class="btn btn-primary" onclick="loginUser()">Login</button>
    <div class="switch-form">
      New User? <a onclick="showRegister()">Register Here</a>
    </div>
  </div>

  <!-- Registration Form -->
  <div id="register-form" class="hidden">
    <h2>Register</h2>
    <input type="text" class="form-control" id="reg-name" placeholder="Full Name" required>
    <input type="tel" class="form-control" id="reg-phone" placeholder="Phone Number" required>
    <input type="email" class="form-control" id="reg-email" placeholder="Email" required>
    <input type="password" class="form-control" id="reg-password" placeholder="Password" required>
    <button class="btn btn-primary" onclick="registerUser()">Register</button>
    <div class="switch-form">
      Already have an account? <a onclick="showLogin()">Login Here</a>
    </div>
  </div>
</div>

<script>
  // Switch between forms
  function showRegister(){
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('register-form').classList.remove('hidden');
  }
  function showLogin(){
    document.getElementById('register-form').classList.add('hidden');
    document.getElementById('login-form').classList.remove('hidden');
  }

  // Simple storage for demo purposes
  function registerUser(){
    const name = document.getElementById('reg-name').value;
    const phone = document.getElementById('reg-phone').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;

    if(!name || !phone || !email || !password){
      alert("Please fill all fields");
      return;
    }

    let users = JSON.parse(localStorage.getItem('users')) || [];
    users.push({name, phone, email, password});
    localStorage.setItem('users', JSON.stringify(users));

    alert("Registration successful! Please login.");
    showLogin();
  }

  function loginUser(){
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    let users = JSON.parse(localStorage.getItem('users')) || [];
    const user = users.find(u => u.email === email && u.password === password);

    if(user){
      alert("Login successful! Welcome, " + user.name);
      // Redirect to home page or dashboard
      window.location.href = "index.html";
    } else {
      alert("Invalid email or password");
    }
  }
</script>

</body>
</html>
